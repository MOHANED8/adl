[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dtd"
version = "0.1.0"
description = "Deep training dynamics framework: datasets, models, hooks, and monitoring."
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/dtd"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=dtd --cov=dashboard --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]
markers = [
    "unit: focused tests for individual functions/classes",
    "integration: tests covering multiple components together",
    "training: training loop and pipeline tests",
    "dataset: dataset and dataloader tests",
    "hooks: hook validation tests",
    "visualization: dashboard and visualization tests",
    "stress: bounded stress and edge-case tests",
    "reproducibility: deterministic reproducibility tests",
]
