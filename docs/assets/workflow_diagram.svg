  <text x="114" y="330" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">1. Hydra Setup</text>
  <text x="114" y="366" fill="#334155" font-family="Arial, sans-serif" font-size="18">Select dataset, model, training,</text>
  <text x="114" y="392" fill="#334155" font-family="Arial, sans-serif" font-size="18">diagnostics, and tracking config.</text>
  <rect x="410" y="290" width="290" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="434" y="330" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">2. Instrumented Fit</text>
  <text x="434" y="366" fill="#334155" font-family="Arial, sans-serif" font-size="18">Trainer logs loss, validation, and</text>
  <text x="434" y="392" fill="#334155" font-family="Arial, sans-serif" font-size="18">internal tensors through hooks.</text>
  <rect x="730" y="290" width="290" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="754" y="330" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">3. Diagnostic Export</text>
  <text x="754" y="366" fill="#334155" font-family="Arial, sans-serif" font-size="18">JSONL and TensorBoard artifacts</text>
  <text x="754" y="392" fill="#334155" font-family="Arial, sans-serif" font-size="18">feed dashboard and evaluator.</text>
