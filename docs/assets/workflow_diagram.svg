  <text x="274" y="608" fill="#4338ca" font-family="Arial, sans-serif" font-size="18">Tune thresholds</text>
  <text x="274" y="636" fill="#4338ca" font-family="Arial, sans-serif" font-size="18">Repeat with controlled changes</text>
